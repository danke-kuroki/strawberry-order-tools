<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人販売受注ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6ED;
    --surface: #FFFFFF;
    --ink: #2B2A24;
    --muted: #6B6A5E;
    --line: #DCD9C8;
    --berry: #A9333B;
    --berry-dark: #7E2029;
    --leaf: #4B7A52;
    --leaf-light: #EAF0E1;
    --amber: #B98426;
    --amber-bg: #FBF1DE;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--ink); font-family: "Zen Kaku Gothic New", sans-serif; line-height: 1.6; }
  h1,h2{ font-family: "Shippori Mincho", serif; font-weight: 700; margin: 0; }
  .app{ max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
  header{ display:flex; align-items:center; gap: 14px; margin-bottom: 26px; }
  header h1{ font-size: 25px; color: var(--berry-dark); }
  header p{ margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  main{ display:grid; grid-template-columns: 360px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 820px){ main{ grid-template-columns: 1fr; } }
  section{ background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--berry); border-radius: 6px; padding: 20px; }
  .list-panel{ border-top-color: var(--leaf); }
  label{ display:block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  textarea, input, select{ width: 100%; font-family: inherit; font-size: 14.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; }
  textarea{ resize: vertical; min-height: 66px; }
  .field{ margin-bottom: 14px; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button{ font-family: inherit; font-size: 14px; font-weight: 500; border: none; border-radius: 4px; padding: 10px 16px; cursor: pointer; }
  .btn-primary{ background: var(--berry); color: #fff; width: 100%; }
  .btn-primary:hover{ background: var(--berry-dark); }
  .btn-primary:disabled{ background: #C9A6A6; cursor: default; }
  .btn-ghost{ background: transparent; color: var(--muted); border: 1px solid var(--line); width: 100%; margin-bottom: 16px; }
  .btn-small{ padding: 5px 10px; font-size: 12.5px; width: auto; }
  .unit-badge{ display:inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 10px; font-size: 11.5px; background: var(--leaf-light); color: var(--leaf); }
  .note-line{ font-size: 12.5px; color: var(--leaf); margin-top: 6px; }
  .divider{ border: none; border-top: 1px solid var(--line); margin: 4px 0 18px; }
  .error-box{ margin-top: 10px; padding: 10px 12px; background: var(--amber-bg); color: #6B4B14; border-radius: 4px; font-size: 13px; }
  .chat-log{ max-height: 230px; overflow-y: auto; display:flex; flex-direction:column; gap: 8px; margin: 12px 0; }
  .bubble{ max-width: 90%; padding: 8px 12px; border-radius: 10px; font-size: 13.5px; }
  .bubble-user{ align-self:flex-end; background: var(--leaf-light); color: var(--ink); }
  .bubble-assistant{ align-self:flex-start; background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
  .quick-replies{ display:flex; flex-wrap:wrap; gap: 6px; margin-bottom: 8px; }
  .quick-reply-btn{ background: var(--surface); border: 1px solid var(--line); padding: 6px 11px; border-radius: 14px; font-size: 12.5px; cursor: pointer; }
  .quick-reply-btn:hover{ border-color: var(--berry); color: var(--berry-dark); }
  .chat-input-line{ display:flex; gap: 6px; }
  .chat-input-line input{ flex: 1; }
  .list-header{ display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .list-header h2{ font-size: 19px; }
  table{ width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td{ text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th{ color: var(--muted); font-weight: 500; font-size: 12.5px; }
  tr.missing-date td.col-date{ color: var(--amber); background: var(--amber-bg); }
  .channel-tag{ display:inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11.5px; background: var(--leaf-light); color: var(--leaf); }
  .raw-note{ color: var(--muted); font-size: 12px; max-width: 220px; }
  .del-btn{ background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12.5px; padding: 4px 6px; }
  .del-btn:hover{ color: var(--berry); }
  .empty-state{ padding: 30px 10px; text-align: center; color: var(--muted); font-size: 14px; }
  .hidden{ display:none; }
  .spinner{ display:inline-block; width: 13px; height: 13px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 14c-6 0-11 5-11 12 0 6 5 11 11 11s11-5 11-11c0-7-5-12-11-12z" fill="#A9333B"/>
      <circle cx="14" cy="24" r="1.4" fill="#F5F6ED"/><circle cx="20" cy="20" r="1.4" fill="#F5F6ED"/>
      <circle cx="26" cy="24" r="1.4" fill="#F5F6ED"/><circle cx="17" cy="29" r="1.4" fill="#F5F6ED"/><circle cx="23" cy="29" r="1.4" fill="#F5F6ED"/>
      <path d="M20 14l-4-6h8l-4 6z" fill="#4B7A52"/>
    </svg>
    <div>
      <h1>個人販売受注ツール</h1>
      <p>商品を選んで登録します。メモを貼り付ければ自動で入力できます。</p>
    </div>
  </header>

  <main>
    <section class="input-panel">
      <div class="field">
        <label for="rawText">注文メモ（貼り付けると自動入力できます・任意）</label>
        <textarea id="rawText" placeholder="例：来月の3日にGパックを3つお願いします"></textarea>
      </div>
      <button class="btn-ghost" id="autofillBtn">メモから自動入力</button>
      <div id="errorBox" class="error-box hidden"></div>
      <div class="chat-log hidden" id="chatLog"></div>
      <div class="chat-input-row hidden" id="chatInputRow">
        <div class="quick-replies" id="quickReplies"></div>
        <div class="chat-input-line">
          <input id="chatReplyInput" placeholder="回答を入力...">
          <button class="btn-small btn-ghost" id="chatSendBtn">送信</button>
        </div>
      </div>
      <hr class="divider">

      <div class="field">
        <label for="productSelect">商品<span class="unit-badge" id="unitBadge"></span></label>
        <select id="productSelect"></select>
      </div>
      <div class="row2 field">
        <div>
          <label for="qtyInput">数量</label>
          <input type="number" id="qtyInput" placeholder="例：3">
        </div>
        <div>
          <label for="dateInput">お届け希望日</label>
          <input type="date" id="dateInput">
        </div>
      </div>
      <div class="row2 field">
        <div>
          <label for="customerInput">お客様名</label>
          <input id="customerInput" placeholder="例：田中様">
        </div>
        <div>
          <label for="channelSelect">経由</label>
          <select id="channelSelect">
            <option>LINE</option><option>Instagram</option><option>Threads</option>
            <option>電話</option><option>その他</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" id="addBtn">この内容で追加する</button>
    </section>

    <section class="list-panel">
      <div class="list-header">
        <h2>個人受注一覧</h2>
        <button class="btn-ghost btn-small" id="exportBtn">CSVで書き出す</button>
      </div>
      <div class="field">
        <label for="webhookInput">AI連携用URL（Apps ScriptのウェブアプリURL・外部ホスティング時のみ使用）</label>
        <div class="row2">
          <input id="webhookInput" placeholder="https://script.google.com/macros/s/.../exec">
          <button class="btn-ghost btn-small" id="saveWebhookBtn" style="width:auto;">保存</button>
        </div>
        <div class="field" style="margin-top:8px;">
          <label for="secretInput">連携用の合言葉（Apps Script側のSECRETと同じ文字列）</label>
          <input id="secretInput" placeholder="例：ichigo2026kobetsu">
        </div>
        <p class="note-line hidden" id="webhookStatus"></p>
      </div>
      <table id="ordersTable">
        <thead>
          <tr><th>希望日</th><th>商品</th><th>数量</th><th>単位</th><th>お客様</th><th>経由</th><th>元メモ</th><th></th></tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state hidden">まだ注文がありません。左のフォームから最初の注文を登録しましょう。</div>
    </section>
  </main>
</div>

<script>
const PRODUCTS = [
  { value: "贈答用", unit: "箱" },
  { value: "Gパック", unit: "パック" },
  { value: "黒パック", unit: "パック" },
  { value: "特販箱", unit: "箱" },
  { value: "カップ(白赤混合)", unit: "カップ" },
  { value: "白いちごGパック", unit: "パック" },
  { value: "白いちご黒パック", unit: "パック" }
];

let orders = [];
let sheetWebhookUrl = "";
let sheetSecret = "";

const storageAdapter = {
  async get(key, shared){
    if(window.storage){ return window.storage.get(key, shared); }
    try{
      const raw = localStorage.getItem(key);
      return raw !== null ? { key, value: raw, shared: !!shared } : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(window.storage){ return window.storage.set(key, value, shared); }
    try{
      localStorage.setItem(key, value);
      return { key, value, shared: !!shared };
    }catch(e){ return null; }
  }
};

async function loadWebhookUrl(){
  try{
    const res = await storageAdapter.get("retail-ai-webhook", true);
    sheetWebhookUrl = res && res.value ? res.value : "";
  }catch(e){ sheetWebhookUrl = ""; }
  document.getElementById("webhookInput").value = sheetWebhookUrl;
  try{
    const res2 = await storageAdapter.get("retail-ai-secret", true);
    sheetSecret = res2 && res2.value ? res2.value : "";
  }catch(e){ sheetSecret = ""; }
  document.getElementById("secretInput").value = sheetSecret;
}

document.getElementById("saveWebhookBtn").addEventListener("click", async () => {
  const url = document.getElementById("webhookInput").value.trim();
  const secret = document.getElementById("secretInput").value.trim();
  const status = document.getElementById("webhookStatus");
  try{
    await storageAdapter.set("retail-ai-webhook", url, true);
    await storageAdapter.set("retail-ai-secret", secret, true);
    sheetWebhookUrl = url;
    sheetSecret = secret;
    status.textContent = "保存しました。";
    status.classList.remove("hidden");
  }catch(e){
    status.textContent = "保存に失敗しました。もう一度お試しください。";
    status.classList.remove("hidden");
  }
});

function populateProductOptions(selectedProduct){
  const select = document.getElementById("productSelect");
  select.innerHTML = PRODUCTS.map(p => `<option value="${p.value}">${p.value}</option>`).join("");
  if(selectedProduct && PRODUCTS.some(p => p.value === selectedProduct)){
    select.value = selectedProduct;
  }
  updateUnitBadge();
}
function updateUnitBadge(){
  const product = document.getElementById("productSelect").value;
  const found = PRODUCTS.find(p => p.value === product);
  document.getElementById("unitBadge").textContent = found ? "単位：" + found.unit : "";
}
document.getElementById("productSelect").addEventListener("change", updateUnitBadge);
populateProductOptions();

function todayInfo(){
  const d = new Date();
  const days = ["日","月","火","水","木","金","土"];
  const dateStr = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  return { dateStr, wd: days[d.getDay()] };
}

async function loadOrders(){
  try{
    const res = await storageAdapter.get("retail-orders-list", true);
    orders = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ orders = []; }
  renderTable();
}
async function saveOrders(){
  try{ await storageAdapter.set("retail-orders-list", JSON.stringify(orders), true); }
  catch(e){ console.error("保存に失敗しました", e); }
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function unitFor(product){
  const found = PRODUCTS.find(p => p.value === product);
  return found ? found.unit : "-";
}

function renderTable(){
  const body = document.getElementById("ordersBody");
  const empty = document.getElementById("emptyState");
  const table = document.getElementById("ordersTable");
  if(orders.length === 0){ table.classList.add("hidden"); empty.classList.remove("hidden"); return; }
  table.classList.remove("hidden"); empty.classList.add("hidden");

  const sorted = [...orders].sort((a,b) => {
    if(!a.orderDate) return 1;
    if(!b.orderDate) return -1;
    return a.orderDate.localeCompare(b.orderDate);
  });

  body.innerHTML = "";
  for(const o of sorted){
    const tr = document.createElement("tr");
    if(!o.orderDate) tr.classList.add("missing-date");
    tr.innerHTML = `
      <td class="col-date">${o.orderDate || "未定"}</td>
      <td>${escapeHtml(o.product)}</td>
      <td>${escapeHtml(o.quantity ?? "-")}</td>
      <td>${escapeHtml(unitFor(o.product))}</td>
      <td>${escapeHtml(o.customerName || "-")}</td>
      <td><span class="channel-tag">${escapeHtml(o.channel)}</span></td>
      <td class="raw-note">${escapeHtml(o.rawText || "")}</td>
      <td><button class="del-btn" data-id="${o.id}">削除</button></td>
    `;
    body.appendChild(tr);
  }
  body.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      orders = orders.filter(o => o.id !== btn.dataset.id);
      await saveOrders();
      renderTable();
    });
  });
}

function callViaJsonp(url){
  return new Promise((resolve, reject) => {
    const cbName = "aiCallback_" + Date.now() + "_" + Math.floor(Math.random()*100000);
    const script = document.createElement("script");
    let settled = false;
    const cleanup = () => { delete window[cbName]; script.remove(); };
    window[cbName] = (data) => { settled = true; cleanup(); resolve(data); };
    script.onerror = () => { if(!settled){ cleanup(); reject(new Error("JSONPリクエストに失敗しました（URLが正しいかご確認ください）")); } };
    script.src = url + "&callback=" + cbName;
    document.body.appendChild(script);
    setTimeout(() => { if(!settled){ cleanup(); reject(new Error("タイムアウトしました（60秒応答なし）")); } }, 60000);
  });
}

async function callClaude(contextText){
  const { dateStr, wd } = todayInfo();
  const productList = PRODUCTS.map(p => p.value).join(",");
  const prompt = `今日は${dateStr}(${wd}曜)。相対日付(来週の水曜=翌週月火始まりの水曜、来月の3日=来月3日)を正確に計算。商品は次の7種類のいずれか一つ:${productList}。以下のやり取り全体から、分かる範囲で情報を抽出してください。書かれていない・断定できない項目は必ずnullにしてください（推測で埋めないでください）。JSONのみ返答:
{"order_date":"YYYY-MM-DD or null","product":"or null","quantity":number or null,"customer_name":"or null"}

やり取り:
${contextText}`;

  if(window.storage){
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 300, messages: [{ role: "user", content: prompt }] })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === "text");
    if(!textBlock) throw new Error("no text response");
    const clean = textBlock.text.replace(/```json|```/g, "").trim();
    return JSON.parse(clean);
  }

  if(!sheetWebhookUrl) throw new Error("AI連携先が未設定です");
  const url = sheetWebhookUrl + "?action=parse&secret=" + encodeURIComponent(sheetSecret) + "&p=" + encodeURIComponent(prompt);
  return await callViaJsonp(url);
}

const WEEKDAYS_JA = ["日","月","火","水","木","金","土"];
function fmtDate(dt){
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
}
function weekdayDate(now, wdChar, nextWeek){
  const targetIdx = WEEKDAYS_JA.indexOf(wdChar);
  const mondayBased = (targetIdx + 6) % 7;
  const curDow = (now.getDay() + 6) % 7;
  const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - curDow);
  const base = nextWeek ? new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() + 7) : thisMonday;
  return new Date(base.getFullYear(), base.getMonth(), base.getDate() + mondayBased);
}
function parseDateLocal(text){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  let mm;
  if(/明後日/.test(text)) return fmtDate(new Date(y,m,d+2));
  if(/明日/.test(text)) return fmtDate(new Date(y,m,d+1));
  if(/今日/.test(text)) return fmtDate(new Date(y,m,d));
  if(mm = text.match(/来週の?([月火水木金土日])曜?/)) return fmtDate(weekdayDate(now, mm[1], true));
  if(mm = text.match(/今週の?([月火水木金土日])曜?/)) return fmtDate(weekdayDate(now, mm[1], false));
  if(mm = text.match(/来月の?(\d{1,2})日/)) return fmtDate(new Date(y, m+1, parseInt(mm[1],10)));
  if(mm = text.match(/(\d{1,2})月(\d{1,2})日/)){
    let dt = new Date(y, parseInt(mm[1],10)-1, parseInt(mm[2],10));
    if(dt < new Date(y,m,d)) dt.setFullYear(y+1);
    return fmtDate(dt);
  }
  if(mm = text.match(/今月の?(\d{1,2})日/)){
    let day = parseInt(mm[1],10);
    let dt = new Date(y,m,day);
    if(dt < new Date(y,m,d)) dt = new Date(y,m+1,day);
    return fmtDate(dt);
  }
  return null;
}
function parseQuantityLocal(text){
  const m = text.match(/(\d+)\s*(パック|箱|個|カップ)?/);
  return m ? parseInt(m[1],10) : null;
}
function parseCustomerLocal(text){
  const m = text.match(/([一-龠ぁ-んァ-ヶー]{1,10})(様|さん)/u);
  return m ? m[1] + m[2] : null;
}
function parseProductLocal(text){
  const sorted = [...PRODUCTS].sort((a,b) => b.value.length - a.value.length);
  for(const p of sorted){
    if(text.includes(p.value)) return p.value;
  }
  return null;
}
function localParse(text){
  return {
    product: parseProductLocal(text),
    quantity: parseQuantityLocal(text),
    order_date: parseDateLocal(text),
    customer_name: parseCustomerLocal(text)
  };
}
function isRetailComplete(p){
  return !!(p.product && p.quantity && p.order_date && p.customer_name);
}
function nextMissingRetail(p){
  if(!p.product) return { field: "product", question: "商品は何にしますか？", choices: PRODUCTS.map(x=>({label:x.value, value:x.value})) };
  if(!p.quantity) return { field: "quantity", question: "数量はいくつですか？", choices: null };
  if(!p.order_date) return { field: "order_date", question: "お届け希望日はいつですか？", choices: null };
  if(!p.customer_name) return { field: "customer_name", question: "お客様のお名前を教えてください。", choices: null };
  return null;
}
function mergeKnown(base, incoming){
  const merged = { ...base };
  for(const key of ["product","quantity","order_date","customer_name"]){
    const v = incoming[key];
    if(v !== null && v !== undefined && v !== ""){
      merged[key] = v;
    }
  }
  return merged;
}

let contextLog = [];
let knownFields = { product: null, quantity: null, order_date: null, customer_name: null };
let originalMemo = "";

function summarizeKnown(p){
  const parts = [];
  if(p.product) parts.push("商品=" + p.product);
  if(p.quantity) parts.push("数量=" + p.quantity);
  if(p.order_date) parts.push("お届け日=" + p.order_date);
  if(p.customer_name) parts.push("お客様名=" + p.customer_name);
  return parts.join(", ");
}
function rebuildContextLog(latestAnswer){
  contextLog = ["元のメモ: " + originalMemo];
  const summary = summarizeKnown(knownFields);
  if(summary) contextLog.push("(既に分かっている項目: " + summary + ")");
  if(latestAnswer) contextLog.push("最新の回答: " + latestAnswer);
}

function appendBubble(role, text){
  const log = document.getElementById("chatLog");
  log.classList.remove("hidden");
  const div = document.createElement("div");
  div.className = "bubble " + (role === "user" ? "bubble-user" : "bubble-assistant");
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function applyParsedToForm(parsed){
  populateProductOptions(parsed.product);
  if(parsed.quantity !== null && parsed.quantity !== undefined && parsed.quantity !== ""){
    document.getElementById("qtyInput").value = parsed.quantity;
  }
  if(parsed.order_date){ document.getElementById("dateInput").value = parsed.order_date; }
  if(parsed.customer_name){ document.getElementById("customerInput").value = parsed.customer_name; }
}

function renderQuickReplies(choices){
  const wrap = document.getElementById("quickReplies");
  wrap.innerHTML = "";
  (choices || []).forEach(choice => {
    const btn = document.createElement("button");
    btn.className = "quick-reply-btn";
    btn.textContent = choice.label;
    btn.addEventListener("click", () => resolveFieldLocally(choice.value, choice.label));
    wrap.appendChild(btn);
  });
}

function presentMissingOrDone(){
  const missing = nextMissingRetail(knownFields);
  if(missing){
    appendBubble("assistant", missing.question);
    renderQuickReplies(missing.choices);
    document.getElementById("chatInputRow").classList.remove("hidden");
    document.getElementById("chatReplyInput").value = "";
  }else{
    applyParsedToForm(knownFields);
    appendBubble("assistant", "内容を確認しました。フォームの内容をご確認のうえ「この内容で追加する」を押してください。");
    document.getElementById("chatInputRow").classList.add("hidden");
  }
}

function resolveFieldLocally(value, label){
  appendBubble("user", label);
  const missing = nextMissingRetail(knownFields);
  if(missing){ knownFields[missing.field] = value; }
  document.getElementById("quickReplies").innerHTML = "";
  document.getElementById("chatInputRow").classList.add("hidden");
  presentMissingOrDone();
}

async function runClarificationStep(){
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("hidden");
  try{
    const parsed = await callClaude(contextLog.join("\n"));
    knownFields = mergeKnown(knownFields, parsed);
    presentMissingOrDone();
  }catch(e){
    errorBox.textContent = "自動での読み取りに失敗しました。下の項目を直接選択・入力してください。[詳細: " + (e && e.message ? e.message : e) + "]";
    errorBox.classList.remove("hidden");
    document.getElementById("chatInputRow").classList.add("hidden");
  }
}

async function sendChatAnswer(text){
  if(!text) return;
  appendBubble("user", text);
  rebuildContextLog(text);
  document.getElementById("quickReplies").innerHTML = "";
  document.getElementById("chatInputRow").classList.add("hidden");
  appendBubble("assistant", "…確認しています");
  await runClarificationStep();
  const log = document.getElementById("chatLog");
  const thinking = [...log.querySelectorAll(".bubble-assistant")].find(el => el.textContent === "…確認しています");
  if(thinking) thinking.remove();
}

document.getElementById("chatSendBtn").addEventListener("click", () => {
  const val = document.getElementById("chatReplyInput").value.trim();
  if(val) sendChatAnswer(val);
});
document.getElementById("chatReplyInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    const val = e.target.value.trim();
    if(val) sendChatAnswer(val);
  }
});

document.getElementById("autofillBtn").addEventListener("click", async () => {
  const raw = document.getElementById("rawText").value.trim();
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("hidden");
  if(!raw){ errorBox.textContent = "注文メモを入力してください。"; errorBox.classList.remove("hidden"); return; }

  document.getElementById("chatLog").innerHTML = "";
  document.getElementById("chatInputRow").classList.add("hidden");
  appendBubble("user", raw);

  const local = localParse(raw);
  knownFields = { product: local.product, quantity: local.quantity, order_date: local.order_date, customer_name: local.customer_name };
  if(isRetailComplete(local)){
    applyParsedToForm(local);
    appendBubble("assistant", "内容を確認しました（自動読み取り）。フォームの内容をご確認のうえ「この内容で追加する」を押してください。");
    return;
  }

  originalMemo = raw;
  rebuildContextLog(null);

  const btn = document.getElementById("autofillBtn");
  btn.disabled = true;
  let elapsed = 0;
  btn.innerHTML = '<span class="spinner"></span>読み取り中...(0秒)';
  const timerHandle = setInterval(() => {
    elapsed++;
    btn.innerHTML = '<span class="spinner"></span>読み取り中...(' + elapsed + '秒)';
  }, 1000);
  try{
    await runClarificationStep();
  }finally{
    clearInterval(timerHandle);
    btn.disabled = false;
    btn.textContent = "メモから自動入力";
  }
});

document.getElementById("addBtn").addEventListener("click", async () => {
  const order = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,8),
    orderDate: document.getElementById("dateInput").value || null,
    product: document.getElementById("productSelect").value,
    quantity: document.getElementById("qtyInput").value.trim(),
    customerName: document.getElementById("customerInput").value.trim(),
    channel: document.getElementById("channelSelect").value,
    rawText: document.getElementById("rawText").value.trim(),
    createdAt: new Date().toISOString()
  };
  orders.push(order);
  await saveOrders();
  renderTable();

  document.getElementById("rawText").value = "";
  document.getElementById("qtyInput").value = "";
  document.getElementById("dateInput").value = "";
  document.getElementById("customerInput").value = "";
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const header = ["希望日","商品","数量","単位","お客様","経由","元メモ"];
  const rows = orders.map(o => [o.orderDate||"", o.product||"", o.quantity||"", unitFor(o.product), o.customerName||"", o.channel||"", (o.rawText||"").replace(/\n/g," ")]);
  const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "retail_orders.csv"; a.click();
  URL.revokeObjectURL(url);
});

loadOrders();
loadWebhookUrl();
</script>
