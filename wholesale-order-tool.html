<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卸販売受注ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F5EC;
    --surface: #FFFFFF;
    --ink: #262620;
    --muted: #6B6A5E;
    --line: #DCD9C8;
    --leaf: #3F6B46;
    --leaf-dark: #2C4E32;
    --leaf-light: #E7EFE3;
    --berry: #A9333B;
    --amber: #B98426;
    --amber-bg: #FBF1DE;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--ink); font-family: "Zen Kaku Gothic New", sans-serif; line-height: 1.6; }
  h1,h2{ font-family: "Shippori Mincho", serif; font-weight: 700; margin: 0; }
  .app{ max-width: 1150px; margin: 0 auto; padding: 32px 20px 60px; }
  header{ display:flex; align-items:center; gap: 14px; margin-bottom: 26px; }
  header h1{ font-size: 25px; color: var(--leaf-dark); }
  header p{ margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  main{ display:grid; grid-template-columns: 380px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 860px){ main{ grid-template-columns: 1fr; } }
  section{ background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--leaf); border-radius: 6px; padding: 20px; }
  .list-panel{ border-top-color: var(--berry); }
  label{ display:block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  textarea, input, select{ width: 100%; font-family: inherit; font-size: 14.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; }
  textarea{ resize: vertical; min-height: 66px; }
  .field{ margin-bottom: 14px; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button{ font-family: inherit; font-size: 14px; font-weight: 500; border: none; border-radius: 4px; padding: 10px 16px; cursor: pointer; }
  .btn-primary{ background: var(--leaf); color: #fff; width: 100%; }
  .btn-primary:hover{ background: var(--leaf-dark); }
  .btn-primary:disabled{ background: #A9BFAB; cursor: default; }
  .btn-ghost{ background: transparent; color: var(--muted); border: 1px solid var(--line); width: 100%; margin-bottom: 16px; }
  .btn-small{ padding: 5px 10px; font-size: 12.5px; width: auto; }
  .unit-badge{ display:inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 10px; font-size: 11.5px; background: var(--amber-bg); color: var(--amber); }
  .note-line{ font-size: 12.5px; color: var(--leaf); margin-top: 6px; }
  .divider{ border: none; border-top: 1px solid var(--line); margin: 4px 0 18px; }
  .error-box{ margin-top: 10px; padding: 10px 12px; background: var(--amber-bg); color: #6B4B14; border-radius: 4px; font-size: 13px; }
  .chat-log{ max-height: 230px; overflow-y: auto; display:flex; flex-direction:column; gap: 8px; margin: 12px 0; }
  .bubble{ max-width: 90%; padding: 8px 12px; border-radius: 10px; font-size: 13.5px; }
  .bubble-user{ align-self:flex-end; background: var(--leaf-light); color: var(--ink); }
  .bubble-assistant{ align-self:flex-start; background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
  .quick-replies{ display:flex; flex-wrap:wrap; gap: 6px; margin-bottom: 8px; }
  .quick-reply-btn{ background: var(--surface); border: 1px solid var(--line); padding: 6px 11px; border-radius: 14px; font-size: 12.5px; cursor: pointer; }
  .quick-reply-btn:hover{ border-color: var(--leaf); color: var(--leaf-dark); }
  .chat-input-line{ display:flex; gap: 6px; }
  .chat-input-line input{ flex: 1; }
  .list-header{ display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .list-header h2{ font-size: 19px; }
  table{ width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td{ text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th{ color: var(--muted); font-weight: 500; font-size: 12.5px; }
  tr.missing-date td.col-date{ color: var(--amber); background: var(--amber-bg); }
  tr.unreviewed{ background: #FFF6C2; }
  tr.unreviewed:hover{ background: #FFEFA0; }
  .review-cell{ text-align: center; }
  .review-cell input{ width: 17px; height: 17px; cursor: pointer; }
  .channel-tag{ display:inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11.5px; background: var(--leaf-light); color: var(--leaf); }
  .grade-tag{ display:inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11.5px; background: var(--amber-bg); color: var(--amber); }
  .raw-note{ color: var(--muted); font-size: 12px; max-width: 200px; }
  .del-btn{ background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12.5px; padding: 4px 6px; }
  .del-btn:hover{ color: var(--berry); }
  .empty-state{ padding: 30px 10px; text-align: center; color: var(--muted); font-size: 14px; }
  .hidden{ display:none; }
  .spinner{ display:inline-block; width: 13px; height: 13px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 14c-6 0-11 5-11 12 0 6 5 11 11 11s11-5 11-11c0-7-5-12-11-12z" fill="#3F6B46"/>
      <circle cx="14" cy="24" r="1.4" fill="#F3F5EC"/><circle cx="20" cy="20" r="1.4" fill="#F3F5EC"/>
      <circle cx="26" cy="24" r="1.4" fill="#F3F5EC"/><circle cx="17" cy="29" r="1.4" fill="#F3F5EC"/><circle cx="23" cy="29" r="1.4" fill="#F3F5EC"/>
      <path d="M20 14l-4-6h8l-4 6z" fill="#A9333B"/>
    </svg>
    <div>
      <h1>卸販売受注ツール</h1>
      <p>品目・グレード・数量を選んで登録します。単位はグレードに応じて自動表示されます。</p>
    </div>
  </header>

  <main>
    <section class="input-panel">
      <div class="field">
        <label for="rawText">注文メモ（貼り付けると自動入力できます・任意）</label>
        <textarea id="rawText" placeholder="例：来週の水曜、あまおうGを10単位でお願いします"></textarea>
      </div>
      <button class="btn-ghost" id="autofillBtn">メモから自動入力</button>
      <div id="errorBox" class="error-box hidden"></div>
      <div class="chat-log hidden" id="chatLog"></div>
      <div class="chat-input-row hidden" id="chatInputRow">
        <div class="quick-replies" id="quickReplies"></div>
        <div class="chat-input-line">
          <input id="chatReplyInput" placeholder="回答を入力...">
          <button class="btn-small btn-ghost" id="chatSendBtn">送信</button>
        </div>
      </div>
      <hr class="divider">

      <div class="field">
        <label for="itemSelect">品目</label>
        <select id="itemSelect">
          <option value="あまおう">あまおう</option>
          <option value="白いちご">白いちご</option>
        </select>
      </div>
      <div class="field">
        <label for="gradeSelect">グレード<span class="unit-badge" id="unitBadge"></span></label>
        <select id="gradeSelect"></select>
      </div>
      <div class="row2 field">
        <div>
          <label for="qtyInput">数量（選択した単位で）</label>
          <input type="number" id="qtyInput" placeholder="例：10">
        </div>
        <div>
          <label for="dateInput">納品希望日</label>
          <input type="date" id="dateInput">
        </div>
      </div>
      <div class="row2 field">
        <div>
          <label for="customerInput">お客様名</label>
          <input id="customerInput" placeholder="例：〇〇青果様">
        </div>
        <div>
          <label for="channelSelect">経由</label>
          <select id="channelSelect">
            <option>LINE</option><option>Instagram</option><option>Threads</option>
            <option>電話</option><option>メール</option><option>その他</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" id="addBtn">この内容で追加する</button>
    </section>

    <section class="list-panel">
      <div class="list-header">
        <h2>卸受注一覧</h2>
        <button class="btn-ghost btn-small" id="exportBtn">CSVで書き出す</button>
      </div>
      <div class="field">
        <label for="webhookInput">スプレッドシート連携URL（Apps ScriptのウェブアプリURL）</label>
        <div class="row2">
          <input id="webhookInput" placeholder="https://script.google.com/macros/s/.../exec">
          <button class="btn-ghost btn-small" id="saveWebhookBtn" style="width:auto;">保存</button>
        </div>
        <p class="note-line" style="color:var(--amber);">※ この画面（Claude.aiのツール）内では、セキュリティ上の理由により外部サイトへの自動送信が実行できません。動かすには、このファイルをGitHub Pagesなど別の場所でホスティングする必要があります。</p>
        <p class="note-line hidden" id="webhookStatus"></p>
      </div>
      <table id="ordersTable">
        <thead>
          <tr><th>内容確認</th><th>データ追加日</th><th>お客様名</th><th>グレード</th><th>数量</th><th>納品日</th><th>元メモ</th><th></th></tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state hidden">まだ注文がありません。左のフォームから最初の注文を登録しましょう。</div>
    </section>
  </main>
</div>

<script>
const GRADES = {
  "あまおう": [
    { value: "DX", unit: "275g単位" },
    { value: "G", unit: "275g単位" },
    { value: "2L", unit: "275g単位" },
    { value: "L", unit: "1kg単位" },
    { value: "M", unit: "1kg単位" },
    { value: "S", unit: "1kg単位" }
  ],
  "白いちご": [
    { value: "G", unit: "275g単位" },
    { value: "L~S", unit: "1kg単位" }
  ]
};

let orders = [];
let sheetWebhookUrl = "";

async function loadWebhookUrl(){
  try{
    const res = await window.storage.get("wholesale-sheet-webhook", true);
    sheetWebhookUrl = res && res.value ? res.value : "";
  }catch(e){ sheetWebhookUrl = ""; }
  document.getElementById("webhookInput").value = sheetWebhookUrl;
}

document.getElementById("saveWebhookBtn").addEventListener("click", async () => {
  const url = document.getElementById("webhookInput").value.trim();
  const status = document.getElementById("webhookStatus");
  try{
    await window.storage.set("wholesale-sheet-webhook", url, true);
    sheetWebhookUrl = url;
    status.textContent = url ? "保存しました。以降、追加した注文は自動でスプレッドシートに書き込まれます。" : "連携を解除しました。";
    status.classList.remove("hidden");
  }catch(e){
    status.textContent = "保存に失敗しました。もう一度お試しください。";
    status.classList.remove("hidden");
  }
});

async function syncToSheet(order){
  if(!sheetWebhookUrl) return;
  try{
    await fetch(sheetWebhookUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(order)
    });
  }catch(e){
    // Claude.aiのアーティファクト内では外部サイトへの通信がブロックされるため、
    // ここで失敗するのは想定内。コンソールには出さず、静かに諦める。
  }
}

function populateGradeOptions(selectedGrade){
  const item = document.getElementById("itemSelect").value;
  const gradeSelect = document.getElementById("gradeSelect");
  const list = GRADES[item] || [];
  gradeSelect.innerHTML = list.map(g => `<option value="${g.value}">${g.value}（${g.unit}）</option>`).join("");
  if(selectedGrade && list.some(g => g.value === selectedGrade)){
    gradeSelect.value = selectedGrade;
  }
  updateUnitBadge();
}

function updateUnitBadge(){
  const item = document.getElementById("itemSelect").value;
  const grade = document.getElementById("gradeSelect").value;
  const list = GRADES[item] || [];
  const found = list.find(g => g.value === grade);
  document.getElementById("unitBadge").textContent = found ? found.unit : "";
}

document.getElementById("itemSelect").addEventListener("change", () => populateGradeOptions());
document.getElementById("gradeSelect").addEventListener("change", updateUnitBadge);
populateGradeOptions();

function todayInfo(){
  const d = new Date();
  const days = ["日","月","火","水","木","金","土"];
  const dateStr = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  return { dateStr, wd: days[d.getDay()] };
}

async function loadOrders(){
  try{
    const res = await window.storage.get("wholesale-orders-list", true);
    orders = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ orders = []; }
  renderTable();
}
async function saveOrders(){
  try{ await window.storage.set("wholesale-orders-list", JSON.stringify(orders), true); }
  catch(e){ console.error("保存に失敗しました", e); }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function unitFor(item, grade){
  const found = (GRADES[item]||[]).find(g => g.value === grade);
  return found ? found.unit : "-";
}
function formatDateOnly(iso){
  return iso ? iso.slice(0,10) : "-";
}

function renderTable(){
  const body = document.getElementById("ordersBody");
  const empty = document.getElementById("emptyState");
  const table = document.getElementById("ordersTable");
  if(orders.length === 0){ table.classList.add("hidden"); empty.classList.remove("hidden"); return; }
  table.classList.remove("hidden"); empty.classList.add("hidden");

  const sorted = [...orders].sort((a,b) => {
    if(!a.orderDate) return 1;
    if(!b.orderDate) return -1;
    return a.orderDate.localeCompare(b.orderDate);
  });

  body.innerHTML = "";
  for(const o of sorted){
    const tr = document.createElement("tr");
    if(!o.orderDate) tr.classList.add("missing-date");
    if(!o.reviewed) tr.classList.add("unreviewed");
    tr.innerHTML = `
      <td class="review-cell"><input type="checkbox" data-id="${o.id}" class="review-check" ${o.reviewed ? "checked" : ""}></td>
      <td>${escapeHtml(formatDateOnly(o.createdAt))}</td>
      <td>${escapeHtml(o.customerName || "-")}</td>
      <td><span class="grade-tag">${escapeHtml(o.item)} ${escapeHtml(o.grade)}</span></td>
      <td>${escapeHtml(o.quantity ?? "-")}</td>
      <td class="col-date">${o.orderDate || "未定"}</td>
      <td class="raw-note">${escapeHtml(o.rawText || "")}</td>
      <td><button class="del-btn" data-id="${o.id}">削除</button></td>
    `;
    body.appendChild(tr);
  }
  body.querySelectorAll(".review-check").forEach(box => {
    box.addEventListener("change", async () => {
      const order = orders.find(o => o.id === box.dataset.id);
      if(order){ order.reviewed = box.checked; }
      await saveOrders();
      renderTable();
    });
  });
  body.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      orders = orders.filter(o => o.id !== btn.dataset.id);
      await saveOrders();
      renderTable();
    });
  });
}

async function callClaude(contextText){
  const { dateStr, wd } = todayInfo();
  const prompt = `今日は${dateStr}(${wd}曜)。相対日付(来週の水曜=翌週月火始まりの水曜、来月の3日=来月3日)を正確に計算。品目はあまおう/白いちご。グレードはあまおうならDX,G,2L,L,M,S、白いちごならG,L~S。品目(該当時グレード)・数量・納品日・お客様名が全て確定したらstatus="complete"。未確定が1つでもあれば最重要な1項目だけ短く質問し、選択肢が絞れればoptionsに(2〜3個)、自由記述で良ければnullに。JSONのみ返答:
{"order_date":"YYYY-MM-DD or null","item":"or null","grade":"or null","quantity":number or null,"customer_name":"or null","status":"complete or needs_clarification","question":"or null","options":array or null,"note":"or null"}

やり取り:
${contextText}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 300, messages: [{ role: "user", content: prompt }] })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === "text");
  if(!textBlock) throw new Error("no text response");
  const clean = textBlock.text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

const WEEKDAYS_JA = ["日","月","火","水","木","金","土"];
function fmtDate(dt){
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
}
function weekdayDate(now, wdChar, nextWeek){
  const targetIdx = WEEKDAYS_JA.indexOf(wdChar);
  const mondayBased = (targetIdx + 6) % 7;
  const curDow = (now.getDay() + 6) % 7;
  const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - curDow);
  const base = nextWeek ? new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() + 7) : thisMonday;
  return new Date(base.getFullYear(), base.getMonth(), base.getDate() + mondayBased);
}
function parseDateLocal(text){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  let mm;
  if(/明後日/.test(text)) return fmtDate(new Date(y,m,d+2));
  if(/明日/.test(text)) return fmtDate(new Date(y,m,d+1));
  if(/今日/.test(text)) return fmtDate(new Date(y,m,d));
  if(mm = text.match(/来週の?([月火水木金土日])曜?/)) return fmtDate(weekdayDate(now, mm[1], true));
  if(mm = text.match(/今週の?([月火水木金土日])曜?/)) return fmtDate(weekdayDate(now, mm[1], false));
  if(mm = text.match(/来月の?(\d{1,2})日/)) return fmtDate(new Date(y, m+1, parseInt(mm[1],10)));
  if(mm = text.match(/(\d{1,2})月(\d{1,2})日/)){
    let dt = new Date(y, parseInt(mm[1],10)-1, parseInt(mm[2],10));
    if(dt < new Date(y,m,d)) dt.setFullYear(y+1);
    return fmtDate(dt);
  }
  if(mm = text.match(/今月の?(\d{1,2})日/)){
    let day = parseInt(mm[1],10);
    let dt = new Date(y,m,day);
    if(dt < new Date(y,m,d)) dt = new Date(y,m+1,day);
    return fmtDate(dt);
  }
  return null;
}
function parseQuantityLocal(text){
  const m = text.match(/(\d+)\s*(パック|箱|個|kg|単位)?/);
  return m ? parseInt(m[1],10) : null;
}
function parseCustomerLocal(text){
  const m = text.match(/([一-龠ぁ-んァ-ヶー]{1,10})(様|さん)/u);
  return m ? m[1] + m[2] : null;
}
function parseItemGradeLocal(text){
  let item = null, grade = null;
  if(/白いちご|白イチゴ/.test(text)) item = "白いちご";
  else if(/あまおう/.test(text)) item = "あまおう";

  if(item === "白いちご"){
    if(/L\s*[~\-～]\s*S/i.test(text)) grade = "L~S";
    else if(/\bG\b/.test(text)) grade = "G";
  }else if(item === "あまおう"){
    for(const c of ["DX","2L","G","L","M","S"]){
      const re = new RegExp("(^|[^A-Za-z0-9])" + c + "([^A-Za-z0-9]|$)");
      if(re.test(text)){ grade = c; break; }
    }
  }
  return { item, grade };
}
function localParse(text){
  const { item, grade } = parseItemGradeLocal(text);
  return {
    item, grade,
    quantity: parseQuantityLocal(text),
    order_date: parseDateLocal(text),
    customer_name: parseCustomerLocal(text)
  };
}
function isWholesaleComplete(p){
  if(!p.item || !p.quantity || !p.order_date || !p.customer_name) return false;
  const validGrades = (GRADES[p.item]||[]).map(g=>g.value);
  return validGrades.includes(p.grade);
}

let contextLog = [];

function appendBubble(role, text){
  const log = document.getElementById("chatLog");
  log.classList.remove("hidden");
  const div = document.createElement("div");
  div.className = "bubble " + (role === "user" ? "bubble-user" : "bubble-assistant");
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function applyParsedToForm(parsed){
  if(parsed.item && GRADES[parsed.item]){ document.getElementById("itemSelect").value = parsed.item; }
  populateGradeOptions(parsed.grade);
  if(parsed.quantity !== null && parsed.quantity !== undefined && parsed.quantity !== ""){
    document.getElementById("qtyInput").value = parsed.quantity;
  }
  if(parsed.order_date){ document.getElementById("dateInput").value = parsed.order_date; }
  if(parsed.customer_name){ document.getElementById("customerInput").value = parsed.customer_name; }
}

function renderQuickReplies(options){
  const wrap = document.getElementById("quickReplies");
  wrap.innerHTML = "";
  (options || []).forEach(label => {
    const btn = document.createElement("button");
    btn.className = "quick-reply-btn";
    btn.textContent = label;
    btn.addEventListener("click", () => sendChatAnswer(label));
    wrap.appendChild(btn);
  });
}

async function runClarificationStep(){
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("hidden");
  try{
    const parsed = await callClaude(contextLog.join("\n"));
    if(parsed.status === "needs_clarification"){
      appendBubble("assistant", parsed.question);
      contextLog.push("Q: " + parsed.question + (parsed.options ? "（選択肢: " + parsed.options.join(" / ") + "）" : ""));
      renderQuickReplies(parsed.options);
      document.getElementById("chatInputRow").classList.remove("hidden");
      document.getElementById("chatReplyInput").value = "";
    }else{
      applyParsedToForm(parsed);
      appendBubble("assistant", "内容を確認しました。フォームの内容をご確認のうえ「この内容で追加する」を押してください。");
      document.getElementById("chatInputRow").classList.add("hidden");
      if(parsed.note){
        errorBox.textContent = "※ " + parsed.note;
        errorBox.classList.remove("hidden");
      }
    }
  }catch(e){
    errorBox.textContent = "自動での読み取りに失敗しました。下の項目を直接選択・入力してください。";
    errorBox.classList.remove("hidden");
    document.getElementById("chatInputRow").classList.add("hidden");
  }
}

async function sendChatAnswer(text){
  if(!text) return;
  appendBubble("user", text);
  contextLog.push("A: " + text);
  document.getElementById("quickReplies").innerHTML = "";
  document.getElementById("chatInputRow").classList.add("hidden");
  appendBubble("assistant", "…確認しています");
  await runClarificationStep();
  const log = document.getElementById("chatLog");
  const thinking = [...log.querySelectorAll(".bubble-assistant")].find(el => el.textContent === "…確認しています");
  if(thinking) thinking.remove();
}

document.getElementById("chatSendBtn").addEventListener("click", () => {
  const val = document.getElementById("chatReplyInput").value.trim();
  if(val) sendChatAnswer(val);
});
document.getElementById("chatReplyInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    const val = e.target.value.trim();
    if(val) sendChatAnswer(val);
  }
});

document.getElementById("autofillBtn").addEventListener("click", async () => {
  const raw = document.getElementById("rawText").value.trim();
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("hidden");
  if(!raw){ errorBox.textContent = "注文メモを入力してください。"; errorBox.classList.remove("hidden"); return; }

  document.getElementById("chatLog").innerHTML = "";
  document.getElementById("chatInputRow").classList.add("hidden");
  appendBubble("user", raw);

  const local = localParse(raw);
  if(isWholesaleComplete(local)){
    applyParsedToForm(local);
    appendBubble("assistant", "内容を確認しました（自動読み取り）。フォームの内容をご確認のうえ「この内容で追加する」を押してください。");
    return;
  }

  const hints = [];
  if(local.item) hints.push("品目: " + local.item);
  if(local.grade) hints.push("グレード: " + local.grade);
  if(local.quantity) hints.push("数量: " + local.quantity);
  if(local.order_date) hints.push("納品日: " + local.order_date);
  if(local.customer_name) hints.push("お客様名: " + local.customer_name);
  contextLog = ["元のメモ: " + raw];
  if(hints.length) contextLog.push("(すでに読み取れた項目: " + hints.join(", ") + ")");

  const btn = document.getElementById("autofillBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>読み取り中...';
  try{
    await runClarificationStep();
  }finally{
    btn.disabled = false;
    btn.textContent = "メモから自動入力";
  }
});

document.getElementById("addBtn").addEventListener("click", async () => {
  const order = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,8),
    orderDate: document.getElementById("dateInput").value || null,
    item: document.getElementById("itemSelect").value,
    grade: document.getElementById("gradeSelect").value,
    quantity: document.getElementById("qtyInput").value.trim(),
    customerName: document.getElementById("customerInput").value.trim(),
    channel: document.getElementById("channelSelect").value,
    rawText: document.getElementById("rawText").value.trim(),
    reviewed: false,
    createdAt: new Date().toISOString()
  };
  orders.push(order);
  await saveOrders();
  syncToSheet(order);
  renderTable();

  document.getElementById("rawText").value = "";
  document.getElementById("qtyInput").value = "";
  document.getElementById("dateInput").value = "";
  document.getElementById("customerInput").value = "";
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const header = ["確認済み","希望日","品目","グレード","単位","数量","お客様","経由","元メモ"];
  const rows = orders.map(o => [o.reviewed ? "済" : "", o.orderDate||"", o.item||"", o.grade||"", unitFor(o.item,o.grade), o.quantity||"", o.customerName||"", o.channel||"", (o.rawText||"").replace(/\n/g," ")]);
  const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "wholesale_orders.csv"; a.click();
  URL.revokeObjectURL(url);
});

loadOrders();
loadWebhookUrl();
</script>
</body>
