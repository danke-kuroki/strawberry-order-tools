<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卸販売受注ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF1F6;
    --surface: #FFFFFF;
    --ink: #4A2138;
    --muted: #B0728F;
    --line: #FFD6E4;
    --pink: #FF4F8B;
    --pink-dark: #E23277;
    --pink-light: #FFE3EE;
    --leaf: #3FB88A;
    --leaf-light: #E3FBF1;
    --amber: #E68A1E;
    --amber-bg: #FFF0DB;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--ink); font-family: "Zen Maru Gothic", sans-serif; line-height: 1.6; }
  h1,h2{ font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 800; margin: 0; }
  .app{ max-width: 1150px; margin: 0 auto; padding: 32px 20px 60px; }
  header{ display:flex; align-items:center; gap: 16px; margin-bottom: 20px; }
  header h1{ font-size: 27px; color: var(--pink-dark); }
  header p{ margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  .hero-photo{ width: 100%; max-height: 220px; object-fit: cover; object-position: center 92%; border-radius: 16px; margin-bottom: 24px; border: 4px solid #fff; box-shadow: 0 4px 18px rgba(226,50,119,0.18); }
  .logo-img{ height: 52px; width: auto; border-radius: 10px; }
  main{ display:grid; grid-template-columns: 380px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 860px){ main{ grid-template-columns: 1fr; } }
  section{ background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--pink); border-radius: 14px; padding: 20px; }
  .list-panel{ border-top-color: var(--leaf); }
  label{ display:block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  textarea, input, select{ width: 100%; font-family: inherit; font-size: 14.5px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 10px; }
  textarea{ resize: vertical; min-height: 66px; }
  .field{ margin-bottom: 14px; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button{ font-family: "M PLUS Rounded 1c", sans-serif; font-size: 14px; font-weight: 700; border: none; border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  .btn-primary{ background: var(--pink); color: #fff; width: 100%; box-shadow: 0 3px 10px rgba(255,79,139,0.35); }
  .btn-primary:hover{ background: var(--pink-dark); }
  .btn-primary:disabled{ background: #FFC2D7; box-shadow: none; cursor: default; }
  .btn-ghost{ background: transparent; color: var(--muted); border: 1.5px solid var(--line); width: 100%; margin-bottom: 16px; }
  .btn-small{ padding: 5px 10px; font-size: 12.5px; width: auto; }
  .unit-badge{ display:inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 10px; font-size: 11.5px; background: var(--amber-bg); color: var(--amber); }
  .note-line{ font-size: 12.5px; color: var(--leaf); margin-top: 6px; }
  .divider{ border: none; border-top: 1.5px dashed var(--line); margin: 4px 0 18px; }
  .error-box{ margin-top: 10px; padding: 10px 12px; background: var(--amber-bg); color: #6B4B14; border-radius: 10px; font-size: 13px; }
  .left-column{ display:flex; flex-direction:column; gap: 22px; }
  .chat-panel{ padding: 0; overflow: hidden; display:flex; flex-direction:column; }
  .chat-header{ background: var(--pink); color: #fff; padding: 13px 16px; display:flex; align-items:center; gap: 10px; }
  .chat-avatar{ width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #fff; }
  .chat-title{ font-weight: 800; font-size: 15px; }
  .chat-messages{ background: #E7EEF6; height: 480px; overflow-y: auto; padding: 16px; display:flex; flex-direction:column; gap: 10px; }
  .bubble{ max-width: 82%; padding: 9px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.5; white-space: pre-line; animation: bubbleIn .28s ease; }
  @keyframes bubbleIn{ from{ opacity: 0; transform: translateY(8px) scale(0.97); } to{ opacity: 1; transform: none; } }
  .bubble-user{ align-self:flex-end; background: var(--pink); color: #fff; border-radius: 16px 4px 16px 16px; }
  .bubble-assistant{ align-self:flex-start; background: #fff; color: var(--ink); border-radius: 4px 16px 16px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .quick-replies{ display:flex; flex-wrap:wrap; gap: 6px; align-self:flex-start; max-width: 90%; }
  .quick-reply-btn{ background: #fff; border: 1.5px solid var(--pink-light); padding: 6px 13px; border-radius: 999px; font-size: 12.5px; cursor: pointer; font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 700; color: var(--pink-dark); }
  .quick-reply-btn:hover{ border-color: var(--pink); background: var(--pink-light); }
  .chat-input-bar{ display:flex; gap: 8px; padding: 10px 12px; background: #fff; border-top: 1px solid var(--line); }
  .chat-input-bar input{ flex: 1; border-radius: 999px; }
  .chat-send-btn{ width: 42px; height: 42px; min-width: 42px; border-radius: 50%; background: var(--pink); color: #fff; display:flex; align-items:center; justify-content:center; padding: 0; font-size: 17px; }
  .chat-send-btn:hover{ background: var(--pink-dark); }
  .form-panel .form-note{ font-weight: 800; color: var(--pink-dark); margin: 0 0 16px; font-size: 14px; }
  .list-header{ display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .list-header h2{ font-size: 20px; color: var(--leaf); }
  table{ width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td{ text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th{ color: var(--muted); font-weight: 700; font-size: 12.5px; }
  tr.missing-date td.col-date{ color: var(--amber); background: var(--amber-bg); }
  tr.unreviewed{ background: #FFF6C2; }
  tr.unreviewed:hover{ background: #FFEFA0; }
  .review-cell{ text-align: center; }
  .review-cell input{ width: 17px; height: 17px; cursor: pointer; }
  .channel-tag{ display:inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11.5px; background: var(--leaf-light); color: var(--leaf); }
  .grade-tag{ display:inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11.5px; background: var(--pink-light); color: var(--pink-dark); font-weight: 700; }
  .raw-note{ color: var(--muted); font-size: 12px; max-width: 200px; }
  .del-btn{ background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12.5px; padding: 4px 6px; }
  .del-btn:hover{ color: var(--pink-dark); }
  .empty-state{ padding: 30px 10px; text-align: center; color: var(--muted); font-size: 14px; }
  .hidden{ display:none; }
  .spinner{ display:inline-block; width: 13px; height: 13px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>

<script>
const GRADES = {
  "あまおう": [
    { value: "DX", unit: "275g単位" },
    { value: "G", unit: "275g単位" },
    { value: "2L", unit: "275g単位" },
    { value: "L", unit: "1kg単位" },
    { value: "M", unit: "1kg単位" },
    { value: "S", unit: "1kg単位" }
  ],
  "白いちご": [
    { value: "G", unit: "275g単位" },
    { value: "L~S", unit: "1kg単位" }
  ]
};

let orders = [];

const storageAdapter = {
  async get(key, shared){
    if(window.storage){ return window.storage.get(key, shared); }
    try{
      const raw = localStorage.getItem(key);
      return raw !== null ? { key, value: raw, shared: !!shared } : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(window.storage){ return window.storage.set(key, value, shared); }
    try{
      localStorage.setItem(key, value);
      return { key, value, shared: !!shared };
    }catch(e){ return null; }
  }
};

const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyh5Iv-IFrNvFVHTfroqSJG_6az2Pdc08Hqud5cwLPpiawSwntuHj3DA8QBp3faVNkW/exec";

async function syncToSheet(order){
  try{
    const url = SHEET_WEBHOOK_URL + "?action=add"
      + "&createdAt=" + encodeURIComponent(order.createdAt || "")
      + "&customerName=" + encodeURIComponent(order.customerName || "")
      + "&item=" + encodeURIComponent(order.item || "")
      + "&grade=" + encodeURIComponent(order.grade || "")
      + "&quantity=" + encodeURIComponent(order.quantity || "")
      + "&orderDate=" + encodeURIComponent(order.orderDate || "")
      + "&rawText=" + encodeURIComponent(order.rawText || "");
    return await callExternal(url);
  }catch(e){
    // Claude.aiのアーティファクト内では外部サイトへの通信がブロックされるため、
    // ここで失敗するのは想定内。
    return { status: "error", message: e.message };
  }
}

function populateGradeOptions(selectedGrade){
  const item = document.getElementById("itemSelect").value;
  const gradeSelect = document.getElementById("gradeSelect");
  const list = GRADES[item] || [];
  gradeSelect.innerHTML = list.map(g => `<option value="${g.value}">${g.value}（${g.unit}）</option>`).join("");
  if(selectedGrade && list.some(g => g.value === selectedGrade)){
    gradeSelect.value = selectedGrade;
  }
  updateUnitBadge();
}

function updateUnitBadge(){
  const item = document.getElementById("itemSelect").value;
  const grade = document.getElementById("gradeSelect").value;
  const list = GRADES[item] || [];
  const found = list.find(g => g.value === grade);
  document.getElementById("unitBadge").textContent = found ? found.unit : "";
}

document.getElementById("itemSelect").addEventListener("change", () => populateGradeOptions());
document.getElementById("gradeSelect").addEventListener("change", updateUnitBadge);
populateGradeOptions();

function todayInfo(){
  const d = new Date();
  const days = ["日","月","火","水","木","金","土"];
  const dateStr = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  return { dateStr, wd: days[d.getDay()] };
}

async function loadOrders(){
  try{
    const res = await storageAdapter.get("wholesale-orders-list", true);
    orders = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ orders = []; }
  renderTable();
}
async function saveOrders(){
  try{ await storageAdapter.set("wholesale-orders-list", JSON.stringify(orders), true); }
  catch(e){ console.error("保存に失敗しました", e); }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function unitFor(item, grade){
  const found = (GRADES[item]||[]).find(g => g.value === grade);
  return found ? found.unit : "-";
}
function formatDateOnly(iso){
  return iso ? iso.slice(0,10) : "-";
}

function renderTable(){
  const body = document.getElementById("ordersBody");
  const empty = document.getElementById("emptyState");
  const table = document.getElementById("ordersTable");
  if(orders.length === 0){ table.classList.add("hidden"); empty.classList.remove("hidden"); return; }
  table.classList.remove("hidden"); empty.classList.add("hidden");

  const sorted = [...orders].sort((a,b) => {
    if(!a.orderDate) return 1;
    if(!b.orderDate) return -1;
    return a.orderDate.localeCompare(b.orderDate);
  });

  body.innerHTML = "";
  for(const o of sorted){
    const tr = document.createElement("tr");
    if(!o.orderDate) tr.classList.add("missing-date");
    if(!o.reviewed) tr.classList.add("unreviewed");
    tr.innerHTML = `
      <td class="review-cell"><input type="checkbox" data-id="${o.id}" class="review-check" ${o.reviewed ? "checked" : ""}></td>
      <td>${escapeHtml(formatDateOnly(o.createdAt))}</td>
      <td>${escapeHtml(o.customerName || "-")}</td>
      <td><span class="grade-tag">${escapeHtml(o.item)} ${escapeHtml(o.grade)}</span></td>
      <td>${escapeHtml(o.quantity ?? "-")}</td>
      <td class="col-date">${o.orderDate || "未定"}</td>
      <td class="raw-note">${escapeHtml(o.rawText || "")}</td>
      <td><button class="del-btn" data-id="${o.id}">削除</button></td>
    `;
    body.appendChild(tr);
  }
  body.querySelectorAll(".review-check").forEach(box => {
    box.addEventListener("change", async () => {
      const order = orders.find(o => o.id === box.dataset.id);
      if(order){ order.reviewed = box.checked; }
      await saveOrders();
      renderTable();
    });
  });
  body.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      orders = orders.filter(o => o.id !== btn.dataset.id);
      await saveOrders();
      renderTable();
    });
  });
}

function callViaJsonpOnce(url){
  return new Promise((resolve, reject) => {
    const cbName = "aiCallback_" + Date.now() + "_" + Math.floor(Math.random()*100000);
    const script = document.createElement("script");
    let settled = false;
    const cleanup = () => { delete window[cbName]; script.remove(); };
    window[cbName] = (data) => { settled = true; cleanup(); resolve(data); };
    script.onerror = () => { if(!settled){ cleanup(); reject(new Error("JSONPリクエストに失敗しました（URLが正しいかご確認ください）")); } };
    script.src = url + "&callback=" + cbName;
    document.body.appendChild(script);
    setTimeout(() => { if(!settled){ cleanup(); reject(new Error("タイムアウトしました（60秒応答なし）")); } }, 60000);
  });
}

async function callViaJsonp(url){
  let lastErr;
  for(let attempt = 0; attempt < 3; attempt++){
    try{
      return await callViaJsonpOnce(url);
    }catch(e){
      lastErr = e;
      if(attempt < 2) await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
    }
  }
  throw lastErr;
}

async function callViaFetch(url){
  const response = await fetch(url, { method: "GET" });
  const text = await response.text();
  if(!response.ok){ throw new Error("HTTP " + response.status + ": " + text.slice(0,150)); }
  const clean = text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

// まずfetch（標準的な方式）を試し、失敗したらJSONP（互換性重視の方式）にフォールバックする
async function callExternal(url){
  try{
    return await callViaFetch(url);
  }catch(fetchErr){
    try{
      return await callViaJsonp(url);
    }catch(jsonpErr){
      throw new Error(fetchErr.message + " / " + jsonpErr.message);
    }
  }
}

async function callClaude(contextText){
  const { dateStr, wd } = todayInfo();
  const prompt = `今日は${dateStr}(${wd}曜)。相対日付(来週の水曜=翌週月火始まりの水曜、来月の3日=来月3日)を正確に計算。品目はあまおう/白いちご。グレードはあまおうならDX,G,2L,L,M,S、白いちごならG,L~S。以下のやり取り全体から、分かる範囲で情報を抽出してください。書かれていない・断定できない項目は必ずnullにしてください（推測で埋めないでください）。JSONのみ返答:
{"order_date":"YYYY-MM-DD or null","item":"or null","grade":"or null","quantity":number or null,"customer_name":"or null"}

やり取り:
${contextText}`;

  if(window.storage){
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 300, messages: [{ role: "user", content: prompt }] })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === "text");
    if(!textBlock) throw new Error("no text response");
    const clean = textBlock.text.replace(/```json|```/g, "").trim();
    return JSON.parse(clean);
  }

  const url = SHEET_WEBHOOK_URL + "?action=parse&p=" + encodeURIComponent(prompt);
  return await callExternal(url);
}

const WEEKDAYS_JA = ["日","月","火","水","木","金","土"];
function fmtDate(dt){
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
}
function weekdayDate(now, wdChar, nextWeek){
  const targetIdx = WEEKDAYS_JA.indexOf(wdChar);
  const mondayBased = (targetIdx + 6) % 7;
  const curDow = (now.getDay() + 6) % 7;
  const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - curDow);
  const base = nextWeek ? new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() + 7) : thisMonday;
  return new Date(base.getFullYear(), base.getMonth(), base.getDate() + mondayBased);
}
function parseDateLocal(rawText){
  const text = toHalfWidthDigits(rawText);
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  let mm;
  if(/明後日/.test(text)) return fmtDate(new Date(y,m,d+2));
  if(/明日/.test(text)) return fmtDate(new Date(y,m,d+1));
  if(/今日/.test(text)) return fmtDate(new Date(y,m,d));
  if(mm = text.match(/来週の?([月火水木金土日])曜?/)) return fmtDate(weekdayDate(now, mm[1], true));
  if(mm = text.match(/今週の?([月火水木金土日])曜?/)) return fmtDate(weekdayDate(now, mm[1], false));
  if(mm = text.match(/来月の?(\d{1,2})日/)) return fmtDate(new Date(y, m+1, parseInt(mm[1],10)));
  if(mm = text.match(/(\d{1,2})月(\d{1,2})日/)){
    let dt = new Date(y, parseInt(mm[1],10)-1, parseInt(mm[2],10));
    if(dt < new Date(y,m,d)) dt.setFullYear(y+1);
    return fmtDate(dt);
  }
  if(mm = text.match(/今月の?(\d{1,2})日/)){
    let day = parseInt(mm[1],10);
    let dt = new Date(y,m,day);
    if(dt < new Date(y,m,d)) dt = new Date(y,m+1,day);
    return fmtDate(dt);
  }
  if(mm = text.match(/(\d{1,2})\/(\d{1,2})/)){
    let dt = new Date(y, parseInt(mm[1],10)-1, parseInt(mm[2],10));
    if(dt < new Date(y,m,d)) dt.setFullYear(y+1);
    return fmtDate(dt);
  }
  if(mm = text.match(/^\s*(\d{1,2})日\s*$/)){
    let day = parseInt(mm[1],10);
    let dt = new Date(y,m,day);
    if(dt < new Date(y,m,d)) dt = new Date(y,m+1,day);
    return fmtDate(dt);
  }
  return null;
}
function matchGradeFromText(item, text){
  const list = (GRADES[item]||[]).map(g=>g.value).sort((a,b)=>b.length-a.length);
  for(const code of list){
    const re = new RegExp("(^|[^A-Za-z0-9])" + code.replace("~","\\~") + "([^A-Za-z0-9]|$)", "i");
    if(re.test(text)) return code;
  }
  return null;
}
function toHalfWidthDigits(str){
  return str.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
}
function parseQuantityLocal(text){
  const m = toHalfWidthDigits(text).match(/(\d+)\s*(パック|箱|個|kg|単位)?/);
  return m ? parseInt(m[1],10) : null;
}
function parseCustomerLocal(text){
  const m = text.match(/([一-龠ぁ-んァ-ヶー]{1,10})(様|さん)/u);
  return m ? m[1] + m[2] : null;
}
function parseItemGradeLocal(text){
  let item = null, grade = null;
  if(/白いちご|白イチゴ/.test(text)) item = "白いちご";
  else if(/あまおう/.test(text)) item = "あまおう";

  if(item === "白いちご"){
    if(/L\s*[~\-～]\s*S/i.test(text)) grade = "L~S";
    else if(/\bG\b/.test(text)) grade = "G";
  }else if(item === "あまおう"){
    for(const c of ["DX","2L","G","L","M","S"]){
      const re = new RegExp("(^|[^A-Za-z0-9])" + c + "([^A-Za-z0-9]|$)");
      if(re.test(text)){ grade = c; break; }
    }
  }
  return { item, grade };
}
function localParse(text){
  const { item, grade } = parseItemGradeLocal(text);
  return {
    item, grade,
    quantity: parseQuantityLocal(text),
    order_date: parseDateLocal(text),
    customer_name: parseCustomerLocal(text)
  };
}
function isWholesaleComplete(p){
  if(!p.item || !p.quantity || !p.order_date || !p.customer_name) return false;
  const validGrades = (GRADES[p.item]||[]).map(g=>g.value);
  return validGrades.includes(p.grade);
}
function nextMissingWholesale(p){
  if(!p.item) return { field: "item", question: "品目はどちらですか？", choices: [{label:"あまおう",value:"あまおう"},{label:"白いちご",value:"白いちご"}] };
  const gradeList = GRADES[p.item] || [];
  const validGrades = gradeList.map(g=>g.value);
  if(!validGrades.includes(p.grade)){
    return { field: "grade", question: "どの規格ですか？", choices: gradeList.map(g => ({ label: g.value + "（" + g.unit + "）", value: g.value })) };
  }
  if(!p.quantity) return { field: "quantity", question: "数量はいくつですか？", choices: null };
  if(!p.order_date) return { field: "order_date", question: "納品希望日はいつですか？", choices: null };
  if(!p.customer_name) return { field: "customer_name", question: "お客様のお名前を教えてください。", choices: null };
  return null;
}
function mergeKnown(base, incoming){
  const merged = { ...base };
  for(const key of ["item","grade","quantity","order_date","customer_name"]){
    const v = incoming[key];
    if(v !== null && v !== undefined && v !== ""){
      merged[key] = v;
    }
  }
  // 品目が変わったら、対応しないグレードは破棄する
  if(merged.item && merged.grade){
    const validGrades = (GRADES[merged.item]||[]).map(g=>g.value);
    if(!validGrades.includes(merged.grade)) merged.grade = null;
  }
  return merged;
}

let contextLog = [];
let knownFields = { item: null, grade: null, quantity: null, order_date: null, customer_name: null };
let originalMemo = "";

function summarizeKnown(p){
  const parts = [];
  if(p.item) parts.push("品目=" + p.item);
  if(p.grade) parts.push("グレード=" + p.grade);
  if(p.quantity) parts.push("数量=" + p.quantity);
  if(p.order_date) parts.push("納品日=" + p.order_date);
  if(p.customer_name) parts.push("お客様名=" + p.customer_name);
  return parts.join(", ");
}
function rebuildContextLog(latestAnswer){
  contextLog = ["元のメモ: " + originalMemo];
  const summary = summarizeKnown(knownFields);
  if(summary) contextLog.push("(既に分かっている項目: " + summary + ")");
  if(latestAnswer) contextLog.push("最新の回答: " + latestAnswer);
}

function appendBubble(role, text){
  const log = document.getElementById("chatMessages");
  const div = document.createElement("div");
  div.className = "bubble " + (role === "user" ? "bubble-user" : "bubble-assistant");
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function applyParsedToForm(parsed){
  if(parsed.item && GRADES[parsed.item]){ document.getElementById("itemSelect").value = parsed.item; }
  populateGradeOptions(parsed.grade);
  if(parsed.quantity !== null && parsed.quantity !== undefined && parsed.quantity !== ""){
    document.getElementById("qtyInput").value = parsed.quantity;
  }
  if(parsed.order_date){ document.getElementById("dateInput").value = parsed.order_date; }
  if(parsed.customer_name){ document.getElementById("customerInput").value = parsed.customer_name; }
}

function renderQuickReplies(choices){
  if(!choices || !choices.length) return;
  const container = document.getElementById("chatMessages");
  const wrap = document.createElement("div");
  wrap.className = "quick-replies";
  wrap.id = "activeQuickReplies";
  choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.className = "quick-reply-btn";
    btn.textContent = choice.label;
    btn.addEventListener("click", () => resolveFieldLocally(choice.value, choice.label));
    wrap.appendChild(btn);
  });
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}
function clearActiveQuickReplies(){
  const el = document.getElementById("activeQuickReplies");
  if(el) el.remove();
}

function presentMissingOrDone(){
  const missing = nextMissingWholesale(knownFields);
  if(missing){
    appendBubble("assistant", missing.question);
    renderQuickReplies(missing.choices);
  }else{
    applyParsedToForm(knownFields);
    appendBubble("assistant", "内容を確認しました。下のフォームの内容をご確認のうえ「この内容で追加する」を押してください。");
  }
}

// 選択肢ボタンを押した場合：自分たちが用意した値なので、AIに聞き直さずその場で確定する
function resolveFieldLocally(value, label){
  clearActiveQuickReplies();
  appendBubble("user", label);
  const missing = nextMissingWholesale(knownFields);
  if(missing){ knownFields[missing.field] = value; }
  presentMissingOrDone();
}

function removeThinkingBubble(){
  const log = document.getElementById("chatMessages");
  const bubbles = [...log.querySelectorAll(".bubble-assistant")];
  const thinking = bubbles.reverse().find(el => el.textContent === "…確認しています");
  if(thinking) thinking.remove();
}

async function runClarificationStep(){
  try{
    const parsed = await callClaude(contextLog.join("\n"));
    knownFields = mergeKnown(knownFields, parsed);
    presentMissingOrDone();
  }catch(e){
    appendBubble("assistant", "自動での読み取りに失敗しました。下のフォームから直接選択・入力してください。[詳細: " + (e && e.message ? e.message : e) + "]");
  }
}

function tryResolveLocally(field, text){
  if(field === "item"){
    if(/白いちご/.test(text)) return "白いちご";
    if(/あまおう/.test(text)) return "あまおう";
    return null;
  }
  if(field === "grade"){
    return matchGradeFromText(knownFields.item, text);
  }
  if(field === "quantity"){
    return parseQuantityLocal(text);
  }
  if(field === "order_date"){
    return parseDateLocal(text);
  }
  if(field === "customer_name"){
    const m = parseCustomerLocal(text);
    if(m) return m;
    const trimmed = text.trim();
    return (trimmed.length > 0 && trimmed.length <= 15) ? trimmed : null;
  }
  return null;
}

let conversationStarted = false;

async function sendChatMessage(text){
  if(!text) return;
  clearActiveQuickReplies();
  appendBubble("user", text);

  if(!conversationStarted){
    conversationStarted = true;
    originalMemo = text;
    const local = localParse(text);
    knownFields = { item: local.item, grade: local.grade, quantity: local.quantity, order_date: local.order_date, customer_name: local.customer_name };
    if(isWholesaleComplete(local)){
      applyParsedToForm(local);
      appendBubble("assistant", "内容を確認しました（自動読み取り）。下のフォームの内容をご確認のうえ「この内容で追加する」を押してください。");
      return;
    }
    rebuildContextLog(null);
    appendBubble("assistant", "…確認しています");
    await runClarificationStep();
    removeThinkingBubble();
    return;
  }

  const missing = nextMissingWholesale(knownFields);
  const field = missing ? missing.field : null;
  const resolved = field ? tryResolveLocally(field, text) : null;
  if(resolved !== null && resolved !== undefined && resolved !== ""){
    knownFields[field] = resolved;
    presentMissingOrDone();
    return;
  }

  rebuildContextLog(text);
  appendBubble("assistant", "…確認しています");
  await runClarificationStep();
  removeThinkingBubble();
}

document.getElementById("chatSendMainBtn").addEventListener("click", () => {
  const input = document.getElementById("chatTextInput");
  const val = input.value.trim();
  if(val){ input.value = ""; sendChatMessage(val); }
});
document.getElementById("chatTextInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    const val = e.target.value.trim();
    if(val){ e.target.value = ""; sendChatMessage(val); }
  }
});

document.getElementById("addBtn").addEventListener("click", async () => {
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("hidden");

  const itemVal = document.getElementById("itemSelect").value;
  const gradeVal = document.getElementById("gradeSelect").value;
  const qtyVal = document.getElementById("qtyInput").value.trim();
  const dateVal = document.getElementById("dateInput").value;
  const customerVal = document.getElementById("customerInput").value.trim();

  const requiredChecks = [
    { ok: !!itemVal, label: "品目" },
    { ok: !!gradeVal, label: "グレード" },
    { ok: !!qtyVal, label: "数量" },
    { ok: !!dateVal, label: "納品希望日" },
    { ok: !!customerVal, label: "お客様名" }
  ];
  const firstMissing = requiredChecks.find(c => !c.ok);
  if(firstMissing){
    errorBox.textContent = "「" + firstMissing.label + "」の項目が未記入です。";
    errorBox.classList.remove("hidden");
    return;
  }

  const order = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,8),
    orderDate: dateVal,
    item: itemVal,
    grade: gradeVal,
    quantity: qtyVal,
    customerName: customerVal,
    rawText: originalMemo,
    reviewed: false,
    createdAt: new Date().toISOString()
  };
  orders.push(order);
  await saveOrders();
  renderTable();

  const confirmMsg = document.getElementById("orderConfirmMsg");
  confirmMsg.textContent = "ご注文ありがとうございます。対応可能かどうかを24時間以内に返信いたしますので、しばしお待ちください。";
  confirmMsg.classList.remove("hidden");

  conversationStarted = false;
  appendBubble("assistant", "ありがとうございます。続けて別のご注文があれば、お聞かせください。");

  const webhookStatus = document.getElementById("webhookStatus");
  webhookStatus.textContent = "スプレッドシートに書き込み中...";
  webhookStatus.style.color = "var(--leaf)";
  webhookStatus.classList.remove("hidden");
  const syncResult = await syncToSheet(order);
  if(syncResult && syncResult.status === "ok"){
    webhookStatus.textContent = "✓ スプレッドシートに書き込みました。";
    webhookStatus.style.color = "var(--leaf)";
  }else{
    webhookStatus.textContent = "✗ スプレッドシートへの書き込みに失敗しました: " + (syncResult && (syncResult.message || syncResult.status) || "不明なエラー");
    webhookStatus.style.color = "var(--amber)";
  }
  webhookStatus.classList.remove("hidden");

  originalMemo = "";
  document.getElementById("qtyInput").value = "";
  document.getElementById("dateInput").value = "";
  document.getElementById("customerInput").value = "";
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const header = ["確認済み","希望日","品目","グレード","単位","数量","お客様","元メモ"];
  const rows = orders.map(o => [o.reviewed ? "済" : "", o.orderDate||"", o.item||"", o.grade||"", unitFor(o.item,o.grade), o.quantity||"", o.customerName||"", (o.rawText||"").replace(/\n/g," ")]);
  const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "wholesale_orders.csv"; a.click();
  URL.revokeObjectURL(url);
});
